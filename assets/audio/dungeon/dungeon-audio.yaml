    negative_prompt: music, melody, speech, ambience, reverb tail, echo, impact, thud, distortion
    duration: 3
    seeds: [4841, 4842]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 80
      - op: peak_normalize
        peak_db: -2

  - id: foe-telegraph
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Ominous rising low rumble wind-up, tension swell before a heavy blow, short,
      isolated studio recording
    negative_prompt: music, melody, speech, ambience bed, echo, repeated, impact hit, distortion
    duration: 3
    seeds: [4851, 4852]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 4
        out_ms: 120
      - op: peak_normalize
        peak_db: -2

  - id: foe-poof
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Soft smoke poof puff, quick airy burst as a creature vanishes, one event,
      isolated studio recording
    negative_prompt: music, melody, speech, ambience, reverb tail, echo, repeated, harsh, distortion
    duration: 3
    seeds: [4861, 4862]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 100
      - op: peak_normalize
        peak_db: -2

  # ---- Boss theme (model) ----
  - id: boss-bgm
    kind: music
    engine: stable-audio-3-small-music
    prompt: >
      Heavy slow monstrous boss battle loop for a creature RPG, huge pounding war
      drums, ominous low brass swells, dread male choir, grinding tension, immense
      scale, minor key, seamless loop, fully instrumental
    negative_prompt: vocals lyrics, speech, silence, sparse, fast upbeat, cheerful, slow quiet intro, distortion
    duration: 24
