    negative_prompt: music, melody, speech, ambience, long reverb tail, echo, repeated, distortion
    duration: 3
    seeds: [4821, 4822]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 200
      - op: peak_normalize
        peak_db: -1

  - id: combat-brace
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Solid metallic shield brace, short defensive clank and settle, one event,
      isolated studio recording
    negative_prompt: music, melody, speech, ambience, reverb, echo, repeated, distortion
    duration: 3
    seeds: [4831, 4832]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
