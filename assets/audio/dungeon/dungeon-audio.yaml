    negative_prompt: music, melody, speech, ambience bed, long reverb tail, echo, repeated, distortion
    duration: 3
    seeds: [4801, 4802]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
