  # ---- Return-to-desktop chime (procedural) ----
  - id: return-chime
    kind: sfx
    engine: procedural
    preset: victory_jingle
    duration: 1.0
    seeds: [4951]
    license: NOASSERTION
    params:
      root_note: G4
      tone: marimba
      brightness: 0.4
    postprocess:
