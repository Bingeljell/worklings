      - op: fade
        in_ms: 2
        out_ms: 150
      - op: peak_normalize
        peak_db: -2

  - id: combat-crit
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Sharp heavy critical combat impact with a bright metallic zing, single
