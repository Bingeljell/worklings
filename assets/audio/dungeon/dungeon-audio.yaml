# Cache Warren dungeon audio — BGM + combat SFX for the Worklings arena.
# Model-generated textures (BGM, impacts, whoosh) via stable-audio; clean tonal
# cues (countdown, victory, defeat, debuff, harden) via the deterministic
# procedural engine. Rebuild: audio-lab build assets/audio/dungeon/dungeon-audio.yaml
version: 1
project: worklings-dungeon

defaults:
  sample_rate: 48000
  channels: mono
  master_format: wav
  exports:
    - wav
    - ogg

assets:
  # ---- Background music bed ----
  - id: dungeon-bgm
    kind: music
    engine: stable-audio-3-small-music
    prompt: >
      Driving dungeon battle loop for a creature RPG, steady pounding tribal war
      drums, pulsing low bass ostinato, tense sustained strings, dark choral pad,
      continuous full energy throughout, minor key, seamless loop, fully
      instrumental
    negative_prompt: vocals, speech, silence, sparse, ambient, slow quiet intro, harsh noise, distortion
    duration: 24
    seeds: [4210, 4211]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: crop
        start_seconds: 4
        duration_seconds: 16
      - op: fade
        in_ms: 300
        out_ms: 500
      - op: peak_normalize
        peak_db: -3

  # ---- Impacts & textures (model) ----
  - id: combat-hit
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Single punchy combat hit, compact thud with a soft organic slap, quick
      transient, warm body, isolated studio recording
    negative_prompt: music, melody, speech, ambience, reverb, echo, repeated hits, metallic ringing, distortion
    duration: 3
    seeds: [4301, 4302, 4303]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 60
      - op: peak_normalize
        peak_db: -1

  - id: combat-slam
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Single heavy crushing slam, deep low boom with stony debris, massive
      weight, one impact only, isolated studio recording
    negative_prompt: music, melody, speech, ambience, long reverb tail, echo, repeated impacts, metallic ringing, distortion
    duration: 3
    seeds: [4311, 4312, 4313]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 120
      - op: peak_normalize
        peak_db: -1

  - id: combat-dodge
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Single quick whoosh of a dodged swing, fast light air movement, short,
      isolated studio recording
    negative_prompt: music, melody, speech, ambience, reverb, echo, impact, thud, distortion
    duration: 3
    seeds: [4321, 4322, 4323]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 40
      - op: peak_normalize
        peak_db: -2

  # ---- Clean tonal cues (procedural, deterministic) ----
  - id: countdown-tick
    kind: sfx
    engine: procedural
    preset: beep
    duration: 0.18
    seeds: [4401]
    license: NOASSERTION
    params:
      frequency_hz: 660
      waveform: sine
    postprocess:
      - op: fade
        in_ms: 2
        out_ms: 60
      - op: peak_normalize
        peak_db: -4

  - id: victory-fanfare
    kind: music
    engine: stable-audio-3-medium
    prompt: >
      Triumphant victory fanfare for a creature RPG win screen, immediate
      celebratory hook from the very first beat, bright brass stabs, sparkling
      glockenspiel and chimes, uplifting synth swells, punchy upbeat percussion,
      joyful major key, cheerful and heroic, concise instrumental, clean studio
      production
    negative_prompt: vocals, speech, harsh noise, slow ambient intro, sad, minor key, distortion
    duration: 8
    seeds: [4510, 4511]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: crop
        start_seconds: 0
        duration_seconds: 6
      - op: fade
        in_ms: 10
        out_ms: 500
      - op: peak_normalize
        peak_db: -1

  - id: defeat-sting
    kind: sfx
    engine: procedural
    preset: error_buzz
    duration: 0.9
    seeds: [4601]
    license: NOASSERTION
    postprocess:
      - op: fade
        in_ms: 2
        out_ms: 200
      - op: peak_normalize
        peak_db: -3

  - id: foe-snare
    kind: sfx
    engine: procedural
    preset: error_buzz
    duration: 0.5
    seeds: [4602]
    license: NOASSERTION
    postprocess:
      - op: fade
        in_ms: 2
        out_ms: 120
      - op: peak_normalize
        peak_db: -4

  - id: foe-harden
    kind: sfx
    engine: procedural
    preset: success
    duration: 0.8
    seeds: [4701]
    license: NOASSERTION
    postprocess:
      - op: peak_normalize
        peak_db: -3
