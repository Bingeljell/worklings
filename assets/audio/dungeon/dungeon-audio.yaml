    negative_prompt: music, melody, speech, ambience, reverb, echo, repeated hits, distortion
    duration: 3
    seeds: [4811, 4812]
    variants_to_keep: 2
    license: Stability AI Community License
    params:
      steps: 8
      cfg: 1.0
      apg: 1.0
    postprocess:
      - op: trim_silence
      - op: fade
        in_ms: 2
        out_ms: 80
      - op: peak_normalize
        peak_db: -1

  - id: combat-unleash
    kind: sfx
    engine: stable-audio-3-small-sfx
    prompt: >
      Magical energy charge swelling into a bright bursting release, powerful
