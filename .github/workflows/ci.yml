name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Godot.NET.Sdk version in godot/worklings/Worklings.csproj.
  GODOT_VERSION: 4.7.2

jobs:
  # The job name is what main's branch protection requires — rename it and the
  # protection rule has to be changed with it.
  build-and-check:
    name: Build and behavioral checks
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Godot (.NET build)
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$archive"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          app=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -name '*.app' | head -n 1)
          echo "GODOT=$app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build godot/worklings -v q --nologo

      - name: Run probes against their references
        run: scripts/godot-probe
